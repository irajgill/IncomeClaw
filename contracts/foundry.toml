[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["PaymentReceipt"]
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
